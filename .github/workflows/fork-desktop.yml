name: Fork desktop builds

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: fork-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    if: github.repository == 'LaMarCab76/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Manual checkout avoids credential cleanup traversing vendored gitlinks.
      - name: Checkout
        env:
          CHECKOUT_REF: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install bundle dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Set fork preview version
        id: version
        run: |
          set -euo pipefail
          base_version="$(node -p "require('./apps/desktop/package.json').version")"
          version="${base_version}-preview.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          node scripts/update-release-package-versions.ts "$version"
          cp .env.example .env

      - name: Install browser secret helper libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Build web, server and desktop bundle
        run: vp run build:desktop

      - name: Upload bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS ${{ matrix.arch }}
    needs: bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
          - arch: x64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
    uses: ./.github/workflows/release-desktop.yml
    with:
      label: macOS ${{ matrix.arch }}
      runner: ${{ matrix.runner }}
      platform: mac
      target: dmg
      arch: ${{ matrix.arch }}
      rust_target: ${{ matrix.rust_target }}
      resource_key: darwin-${{ matrix.arch }}
      version: ${{ needs.bundle.outputs.version }}
      ref: ${{ github.sha }}
      release_channel: preview
      relay_client_tracing: false
      clerk_publishable_key: pk_live_Y2xlcmsudDMuY29kZXMk
      clerk_jwt_template: t3-relay
      clerk_cli_oauth_client_id: hzxSgY2cH10sDU2r
      relay_url: https://relay.t3.codes

  publish:
    name: Publish fork installers
    needs: [bundle, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: desktop-mac-*
          merge-multiple: true
          path: installers

      - name: Wait for CI on this commit
        uses: actions/github-script@v8
        with:
          script: |
            const deadline = Date.now() + 20 * 60 * 1000;
            while (Date.now() < deadline) {
              const { data } = await github.rest.actions.listWorkflowRuns({ ...context.repo, workflow_id: 'ci.yml', head_sha: context.sha, per_page: 20 });
              const run = data.workflow_runs.find(run => run.head_sha === context.sha && run.event === 'push');
              if (run?.status === 'completed') {
                if (run.conclusion !== 'success') throw new Error(`CI failed: ${run.html_url}`);
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 30000));
            }
            throw new Error('CI has not passed on this commit; installers will not be published.');

      - name: Publish complete preview in this fork
        uses: actions/github-script@v8
        env:
          BUILD_VERSION: ${{ needs.bundle.outputs.version }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const version = process.env.BUILD_VERSION;
            const tag = `fork-v${version}`;
            const repo = context.repo;
            if (`${repo.owner}/${repo.repo}` !== 'LaMarCab76/t3code') throw new Error('Fork release repository mismatch.');
            const files = {};
            for (const arch of ['arm64', 'x64']) {
              files[arch] = {};
              for (const extension of ['zip', 'dmg']) {
                const name = `T3-Code-${version}-${arch}.${extension}`;
                const data = fs.readFileSync(path.join('installers', name));
                files[arch][extension] = { name, size: data.length, sha256: crypto.createHash('sha256').update(data).digest('hex') };
              }
            }
            const manifest = { schemaVersion: 1, repository: 'LaMarCab76/t3code', version, commit: context.sha, appId: 'com.t3tools.t3code', files };
            fs.writeFileSync('installers/fork-update.json', JSON.stringify(manifest, null, 2) + '\n');
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ ...repo, tag })).data;
              if (!release.draft) {
                const assets = await github.paginate(github.rest.repos.listReleaseAssets, { ...repo, release_id: release.id });
                if (Object.values(files).every(group => Object.values(group).every(file => assets.some(asset => asset.name === file.name && asset.size === file.size))) && assets.some(asset => asset.name === 'fork-update.json')) return;
                throw new Error('Published release is incomplete. Refusing to modify its update assets.');
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                ...repo, tag_name: tag, target_commitish: context.sha,
                name: `T3 Code fork ${version}`, prerelease: true, draft: true, make_latest: 'false',
                body: `Build of ${context.sha}. Includes macOS Apple Silicon and Intel installers.\n\nPersonal fork updates can be checked, downloaded and installed from T3 Code. These builds are ad hoc signed and are not notarized by Apple.`,
              })).data;
            }
            const names = [...Object.values(files).flatMap(group => Object.values(group).map(file => file.name)), 'fork-update.json'];
            const existing = await github.paginate(github.rest.repos.listReleaseAssets, { ...repo, release_id: release.id });
            for (const name of names) {
              const old = existing.find(asset => asset.name === name);
              if (old) await github.rest.repos.deleteReleaseAsset({ ...repo, asset_id: old.id });
              await github.rest.repos.uploadReleaseAsset({ ...repo, release_id: release.id, name, data: fs.readFileSync(path.join('installers', name)) });
            }
            const uploaded = await github.paginate(github.rest.repos.listReleaseAssets, { ...repo, release_id: release.id });
            if (!names.every(name => uploaded.some(asset => asset.name === name && asset.size === fs.statSync(path.join('installers', name)).size))) throw new Error('Incomplete release upload; keeping draft.');
            release = (await github.rest.repos.updateRelease({ ...repo, release_id: release.id, draft: false, make_latest: 'false' })).data;
            await core.summary.addLink('Download fork installers', release.html_url).write();
